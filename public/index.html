<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Matching Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section id="landing" class="landing">
      <h1>Memory Matching Game</h1>
      <p>Flip two tiles at a time and match all pairs in the fewest attempts.</p>
      <div class="levels_container">
        <label class="level_option">
          <input type="radio" name="level" id="easy" value="easy" />
          <span>Easy &mdash; 8 tiles</span>
        </label>
        <label class="level_option">
          <input type="radio" name="level" id="normal" value="normal" />
          <span>Normal &mdash; 16 tiles</span>
        </label>
        <label class="level_option">
          <input type="radio" name="level" id="hard" value="hard" />
          <span>Hard &mdash; 32 tiles</span>
        </label>
      </div>
    </section>

    <section id="game" class="game hidden">
      <header class="game_header">
        <h2 id="level_title">Easy</h2>
        <p class="attempts_line">Attempts: <span id="attempts" class="attempts">0</span></p>
        <div class="game_actions">
          <button id="restart" type="button">Restart</button>
          <button id="change_level" type="button">Change level</button>
        </div>
      </header>
      <p id="status" class="status hidden">🎉 All pairs matched!</p>
      <div class="cells_container"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
