<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LANDING PAGE -->
  <div id="landing-page" class="page">
    <div class="landing-box">
      <h1 class="welcome-title">Welcome!</h1>
      <div class="levels_container">
        <label>
          <input type="radio" name="level" id="easy" value="easy" checked>
          Easy
        </label>
        <label>
          <input type="radio" name="level" id="normal" value="normal">
          Normal
        </label>
        <label>
          <input type="radio" name="level" id="hard" value="hard">
          Hard
        </label>
      </div>
      <button id="start-btn">Start</button>
    </div>
  </div>

  <!-- GAME PAGE -->
  <div id="game-page" class="page hidden">
    <div class="game-box">
      <h1 class="game-title">GAmE YO</h1>
      <p class="tries">Tries: <span id="tries">0</span></p>
      <p id="solved-msg" class="solved-msg hidden">ALL SOLVED!</p>
      <button id="new-game-btn" class="hidden">New Game</button>
      <div class="cells_container" id="cells_container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
