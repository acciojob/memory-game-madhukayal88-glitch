<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Matching Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>Memory Matching Game</h1>

    <!-- Level Selection -->
    <div class="levels_container">
      <label>
        <input type="radio" name="level" id="easy" value="easy" checked />
        Easy (4 pairs)
      </label>
      <label>
        <input type="radio" name="level" id="normal" value="normal" />
        Normal (8 pairs)
      </label>
      <label>
        <input type="radio" name="level" id="hard" value="hard" />
        Hard (16 pairs)
      </label>
    </div>

    <!-- Stats -->
    <div class="stats">
      <span>Attempts: <strong id="attempts">0</strong></span>
      <span>Matches: <strong id="matches">0</strong> / <strong id="totalPairs">4</strong></span>
    </div>

    <!-- Game Grid -->
    <div class="cells_container" id="cells_container"></div>

    <!-- Reset Button -->
    <button id="resetBtn">Restart Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
