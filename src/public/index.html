<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Matching Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-wrapper">
    <h1>Memory Matching Game</h1>

    <!-- Level Selection Container -->
    <div class="levels_container">
      <label>
        <input type="radio" name="difficulty" id="easy" value="4"> Easy (8 tiles)
      </label>
      <label>
        <input type="radio" name="difficulty" id="normal" value="8" checked> Normal (16 tiles)
      </label>
      <label>
        <input type="radio" name="difficulty" id="hard" value="16"> Hard (32 tiles)
      </label>
      <button id="start_btn">Start / Restart Game</button>
    </div>

    <!-- Stats Display -->
    <div class="stats_container">
      <span id="attempts_count">Attempts: 0</span>
      <span id="matches_count">Matches: 0</span>
    </div>

    <!-- Game Grid Container -->
    <div class="cells_container" id="grid"></div>

    <!-- Win Banner -->
    <div id="win_message" class="hidden">
      🎉 Game Completed! All pairs matched!
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
