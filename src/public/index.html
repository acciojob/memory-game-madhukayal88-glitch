<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game_container">
    <h1>Memory Game</h1>

    <div class="levels_container">
      <label>
        <input type="radio" name="level" id="easy" value="easy" />
        Easy
      </label>
      <label>
        <input type="radio" name="level" id="normal" value="normal" />
        Normal
      </label>
      <label>
        <input type="radio" name="level" id="hard" value="hard" />
        Hard
      </label>
    </div>

    <div class="stats">
      <span>Attempts: <strong id="attempts">0</strong></span>
      <span>Matches: <strong id="matches">0</strong> / <strong id="total_pairs">0</strong></span>
    </div>

    <div class="cells_container" id="cells_container"></div>

    <div class="message" id="message"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
