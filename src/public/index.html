<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Matching Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game-wrapper">
    <h1>Memory Matching Game</h1>

    <!-- Level Selection -->
    <div class="levels_container">
      <label>
        <input type="radio" id="easy" name="difficulty" value="easy" checked />
        Easy (4 pairs)
      </label>
      <label>
        <input type="radio" id="normal" name="difficulty" value="normal" />
        Normal (8 pairs)
      </label>
      <label>
        <input type="radio" id="hard" name="difficulty" value="hard" />
        Hard (16 pairs)
      </label>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span>Attempts: <strong id="attempts">0</strong></span>
      <span>Matches: <strong id="matches">0</strong> / <strong id="total-pairs">4</strong></span>
      <button id="restart">Restart</button>
    </div>

    <!-- Game Grid -->
    <div class="cells_container" id="cells_container"></div>

    <!-- Win Message -->
    <div id="win-message" class="win-message hidden">
      🎉 You solved it in <span id="final-attempts">0</span> attempts!
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
